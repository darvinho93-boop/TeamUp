name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # La base locale : sans elle, les tests de RLS s'ignorent au lieu de garder la promesse.
      - run: pnpm db:start

      - run: pnpm verify

      # Parcours joueur dans Chromium : arrivée, coupure réseau, 150 joueurs simulés.
      - run: pnpm --filter @teamup/app exec playwright install --with-deps chromium

      # Le serveur de l'app lit ses clés dans l'environnement : celles de la base locale.
      - run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY)=')"
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" pnpm test:e2e

      - if: always()
        run: pnpm db:stop --no-backup
