name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # La base locale : sans elle, les tests de RLS s'ignorent au lieu de garder la promesse.
      - run: pnpm db:start -x studio,imgproxy,vector,logflare

      - run: pnpm verify

      - if: always()
        run: pnpm db:stop --no-backup
